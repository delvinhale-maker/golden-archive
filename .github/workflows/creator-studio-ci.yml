name: Creator Studio CS5 Gate

on:
  push:
    branches:
      - creator-studio/cs1-foundation-20260910
    paths:
      - "src/lib/creator-studio*.ts"
      - "src/lib/creator-studio*.tsx"
      - "src/routes/_authenticated/creator-studio*.tsx"
      - "src/routes/api/public/creator-studio/**"
      - "supabase/migrations/*creator_studio*.sql"
      - "tests/integration/creator-studio*.test.ts"
      - ".github/workflows/creator-studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-studio-cs5:
    name: Creator Studio CS5 gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      CREATOR_STUDIO_SHOTSTACK_ENV: stage
      CREATOR_STUDIO_ALLOW_PRODUCTION_PROVIDER: "false"
      SHOTSTACK_STAGE_API_KEY: ${{ secrets.SHOTSTACK_STAGE_API_KEY }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provider secret/client safety
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'VITE_[A-Z0-9_]*SHOTSTACK' -- 'src/**/*.ts' 'src/**/*.tsx'; then
            echo "Shotstack secret must never use a VITE_ client prefix"
            exit 1
          fi
          if git grep -nE '(SHOTSTACK_STAGE_API_KEY|SHOTSTACK_PRODUCTION_API_KEY)[[:space:]]*=' -- 'src/**/*.ts' 'src/**/*.tsx'; then
            echo "Shotstack secret must never be committed as a source literal"
            exit 1
          fi

      - name: Run Creator Studio targeted tests
        run: >-
          bunx vitest run
          src/lib/creator-studio.schema.test.ts
          src/lib/creator-studio.template-engine.test.ts
          tests/integration/creator-studio-cs1-foundation.test.ts

      - name: Build
        run: bun run build

      - name: Require Shotstack stage credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHOTSTACK_STAGE_API_KEY:-}" ]; then
            echo "CS5_PROVIDER_CREDENTIAL_MISSING"
            exit 1
          fi
          echo "Shotstack stage credential is present (value not printed)."

      - name: One live Shotstack stage render
        shell: bash
        run: |
          set -euo pipefail
          payload='{"timeline":{"background":"#0F1E35","tracks":[{"clips":[{"asset":{"type":"html","html":"<p>Creator Studio CS5</p>","css":"p{color:#fff;font-size:48px;text-align:center}","width":720,"height":1280,"background":"transparent"},"start":0,"length":1}]}]},"output":{"format":"mp4","resolution":"sd","aspectRatio":"9:16"}}'
          response=$(curl --silent --show-error --fail-with-body \
            -X POST 'https://api.shotstack.io/edit/stage/render' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: ${SHOTSTACK_STAGE_API_KEY}" \
            --data "$payload")
          render_id=$(printf '%s' "$response" | jq -r '.response.id // empty')
          if [ -z "$render_id" ]; then
            echo "Shotstack stage submission did not return a render id"
            exit 1
          fi
          echo "Provider render id: $render_id"
          printf '%s\n' "$render_id" > shotstack-stage-render-id.txt

          terminal=""
          for i in $(seq 1 24); do
            sleep 5
            status_json=$(curl --silent --show-error --fail-with-body \
              -H "x-api-key: ${SHOTSTACK_STAGE_API_KEY}" \
              "https://api.shotstack.io/edit/stage/render/${render_id}?data=false")
            status=$(printf '%s' "$status_json" | jq -r '.response.status // empty')
            echo "Shotstack stage status: $status"
            if [ "$status" = "done" ]; then
              terminal="done"
              break
            fi
            if [ "$status" = "failed" ]; then
              terminal="failed"
              break
            fi
          done
          if [ "$terminal" != "done" ]; then
            echo "Shotstack stage render did not complete successfully"
            exit 1
          fi

      - name: Upload CS5 provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-studio-cs5-provider-${{ github.sha }}
          path: shotstack-stage-render-id.txt
          if-no-files-found: ignore
          retention-days: 14
