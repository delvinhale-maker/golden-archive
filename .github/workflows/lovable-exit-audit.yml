name: Lovable Exit Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    if: github.head_ref == 'migration/aurumvault-lovable-exit' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lovable dependency audit
        run: node scripts/audit-lovable-exit.mjs

      - name: Redirect source-contract regression
        run: |
          bunx vitest run             tests/integration/product-slug-redirect.test.ts             tests/integration/seo-redirect-release-source-contract.test.ts

      - name: Production build
        run: bun run build
