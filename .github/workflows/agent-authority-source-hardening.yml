name: Agent Authority Source Hardening

on:
  push:
    branches: ["feature/ai-agent-authority-passport"]
    paths: [".github/workflows/agent-authority-source-hardening.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-agent-authority-passport
          fetch-depth: 0

      - name: Apply source hardening patch
        run: python scripts/agent-authority-source-hardening.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Agent Authority tests
        run: bunx vitest run src/lib/agent-authority

      - name: Build AurumVault application
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
          VITE_SUPABASE_PROJECT_ID: test-project
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_TEST_EMAIL: ci@example.com
          SUPABASE_TEST_PASSWORD: not-a-real-password

      - name: Commit hardened services and remove temporary patch tooling
        run: |
          rm .github/workflows/agent-authority-source-hardening.yml
          rm scripts/agent-authority-source-hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/agent-authority/service.server.ts src/lib/agent-authority/governance.service.server.ts .github/workflows/agent-authority-source-hardening.yml scripts/agent-authority-source-hardening.py
          git commit -m "Harden Agent Authority approval and evidence trust boundaries"
          git push origin HEAD:feature/ai-agent-authority-passport
