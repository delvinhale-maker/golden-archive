name: SEO Phase 2 Finalize Temporary

on:
  push:
    branches:
      - seo/phase2-product-metadata
    paths:
      - .github/workflows/seo-phase2-finalize-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/phase2-product-metadata
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Harden Product SEO editor to sparse PATCH semantics
        shell: python
        run: |
          from pathlib import Path

          route = Path('src/routes/_authenticated/admin.academy.product-seo.tsx')
          text = route.read_text()

          replacements = {
              'seo_robots_index: z.boolean().optional().default(true),': 'seo_robots_index: z.boolean().optional(),',
              'seo_robots_follow: z.boolean().optional().default(true),': 'seo_robots_follow: z.boolean().optional(),',
              '''      seo_robots_index: payload.seo_robots_index,\n      seo_robots_follow: payload.seo_robots_follow,''': '''      ...(payload.seo_robots_index !== undefined\n        ? { seo_robots_index: payload.seo_robots_index }\n        : {}),\n      ...(payload.seo_robots_follow !== undefined\n        ? { seo_robots_follow: payload.seo_robots_follow }\n        : {}),''',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one route anchor, found {count}: {old[:80]}')
              text = text.replace(old, new)
          route.write_text(text)

          test = Path('tests/integration/product-seo-phase2-source-contract.test.ts')
          text = test.read_text()
          anchor = '''    expect(adminRoute).toContain('as any)\\n      .update(patch)');\n'''
          addition = '''    expect(adminRoute).toContain('seo_robots_index: z.boolean().optional()');\n    expect(adminRoute).toContain('seo_robots_follow: z.boolean().optional()');\n    expect(adminRoute).not.toContain('seo_robots_index: z.boolean().optional().default(true)');\n    expect(adminRoute).not.toContain('seo_robots_follow: z.boolean().optional().default(true)');\n    expect(patchBody).toContain('payload.seo_robots_index !== undefined');\n    expect(patchBody).toContain('payload.seo_robots_follow !== undefined');\n    expect(patchBody).toContain('payload.seo_title !== undefined');\n    expect(patchBody).toContain('payload.seo_secondary_keywords !== undefined');\n'''
          if text.count(anchor) != 1:
              raise SystemExit('expected one Phase 2 test insertion anchor')
          text = text.replace(anchor, anchor + addition)
          test.write_text(text)

          gate = Path('.github/workflows/seo-redirect-release-gate.yml')
          text = gate.read_text()
          text = text.replace('''    branches:\n      - "release/seo-redirect-foundation"\n''', '''    branches:\n      - "release/seo-redirect-foundation"\n      - "seo/**"\n''', 1)

          path_anchor = '''      - "tests/integration/product-canonical-list-links.test.ts"\n'''
          phase2_paths = '''      - "tests/integration/product-canonical-list-links.test.ts"\n      - "tests/integration/product-seo-phase2-source-contract.test.ts"\n      - "src/routes/_authenticated/admin.academy.product-seo.tsx"\n      - "src/routes/_authenticated/admin.academy.upload.tsx"\n      - "src/routes/sitemap[.]xml.ts"\n      - "src/routeTree.gen.ts"\n      - "supabase/migrations/20260910162000_product_seo_metadata.sql"\n'''
          if text.count(path_anchor) != 2:
              raise SystemExit(f'expected two path anchors, found {text.count(path_anchor)}')
          text = text.replace(path_anchor, phase2_paths)

          test_anchor = '''            tests/integration/product-canonical-list-links.test.ts \\\n            tests/integration/seo-redirect-release-source-contract.test.ts\n'''
          test_replacement = '''            tests/integration/product-canonical-list-links.test.ts \\\n            tests/integration/product-seo-phase2-source-contract.test.ts \\\n            tests/integration/seo-redirect-release-source-contract.test.ts\n'''
          if text.count(test_anchor) != 1:
              raise SystemExit('expected one gate test command anchor')
          text = text.replace(test_anchor, test_replacement)

          build_anchor = '''      - name: Production build\n        run: bun run build\n'''
          boundary = '''      - name: Enforce Phase 2 additive migration boundary\n        shell: bash\n        run: |\n          set -euo pipefail\n          migration=supabase/migrations/20260910162000_product_seo_metadata.sql\n          test -f "$migration"\n          if grep -Eiq '\\b(update|insert[[:space:]]+into|delete[[:space:]]+from)[[:space:]]+public\\.marketplace_products\\b|set[[:space:]]+slug[[:space:]]*=' "$migration"; then\n            echo "ERROR: Phase 2 metadata migration must be additive only"\n            exit 1\n          fi\n\n      - name: Production build\n        run: bun run build\n'''
          if text.count(build_anchor) != 1:
              raise SystemExit('expected production build anchor')
          text = text.replace(build_anchor, boundary)
          gate.write_text(text)

      - name: Run focused Phase 2 and Phase 1 SEO regressions
        run: |
          bunx vitest run \
            tests/integration/product-seo-phase2-source-contract.test.ts \
            tests/integration/product-slug-redirect.test.ts \
            tests/integration/product-canonical-list-links.test.ts \
            tests/integration/product-seo-brand.test.ts \
            tests/integration/seo-redirect-release-source-contract.test.ts

      - name: Verify additive migration and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          migration=supabase/migrations/20260910162000_product_seo_metadata.sql
          ! grep -Eiq '\b(update|insert[[:space:]]+into|delete[[:space:]]+from)[[:space:]]+public\.marketplace_products\b|set[[:space:]]+slug[[:space:]]*=' "$migration"
          git diff --check

      - name: Production build
        run: bun run build

      - name: Commit only verified Phase 2 safety changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/routes/_authenticated/admin.academy.product-seo.tsx \
            tests/integration/product-seo-phase2-source-contract.test.ts \
            .github/workflows/seo-redirect-release-gate.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(seo): preserve omitted Phase 2 metadata fields'
          git push origin HEAD:seo/phase2-product-metadata
