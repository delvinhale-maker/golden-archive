name: Aurum Intelligence Phase I
on:
  pull_request:
    paths:
      - "src/lib/aurum-intelligence/**"
      - "src/components/marketplace/AurumGuide.tsx"
      - "src/routes/index.tsx"
      - "src/routes/api/public/intelligence/merchant-signals.ts"
      - "supabase/migrations/20261002110000_aurum_intelligence_phase1.sql"
  push:
    branches: ["feature/aurum-intelligence-phase-1"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/unit/aurum-intelligence.test.ts
      - run: npm run build
