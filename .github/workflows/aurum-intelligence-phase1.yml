name: Aurum Intelligence Phase I
on:
  pull_request:
    paths:
      - "src/lib/aurum-intelligence/**"
      - "src/components/marketplace/AurumGuide.tsx"
      - "src/routes/index.tsx"
      - "src/routes/api/public/intelligence/merchant-signals.ts"
      - "supabase/migrations/20261002110000_aurum_intelligence_phase1.sql"
  push:
    branches: ["feature/aurum-intelligence-phase-1"]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact SHA to certify"
        required: false
        type: string
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/unit/aurum-intelligence.test.ts
      - run: npm run build
      - name: Dispatch-independent staging handoff
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' }}
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          echo "Exact SHA certified for independent staging: ${{ inputs.expected_sha }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/aurum-intelligence-phase-1' }}
    permissions:
      contents: read
    uses: ./.github/workflows/aurumvault-staging-deploy.yml
    with:
      expected_sha: ${{ github.sha }}
    secrets: inherit
