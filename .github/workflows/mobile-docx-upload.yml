name: Mobile Docx Upload

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Runs the mobile .docx upload regression suite against a fresh
# preview build with a short-lived session generated at runtime against
# the independent aurumvault-staging Supabase project, so the authenticated
# /dashboard/new?type=ai_prompt_pack flow is reachable end-to-end.
#
# Cross-browser coverage:
#   - Android Chrome + octet-stream MIME (generic Android reporting)
#   - Android Chrome + empty MIME string (Downloads / third-party picker)
#   - Android Chrome + unsupported file type (rejection message)
#   - iOS Safari (WebKit) + correct OOXML MIME (Safari happy path)
#   - iOS Safari (WebKit) + unsupported file type (rejection message)
#
# Required GitHub Actions repository secrets:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PUBLISHABLE_KEY
#   VITE_SUPABASE_PROJECT_ID
#   SUPABASE_SERVICE_ROLE_KEY
#
# The workflow fails closed unless VITE_SUPABASE_URL is exactly the
# independent aurumvault-staging project (ypelutaddlibqvpaekyq).

jobs:
  docx-upload:
    name: Mobile .docx upload (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-octet-stream
            spec: tests/mobile/upload-docx-android.spec.py
            browser: chromium
          - label: android-empty-mime
            spec: tests/mobile/upload-docx-android-empty-mime.spec.py
            browser: chromium
          - label: android-rejection
            spec: tests/mobile/upload-docx-android-rejection.spec.py
            browser: chromium
          - label: ios-safari
            spec: tests/mobile/upload-docx-ios-safari.spec.py
            browser: webkit
          - label: ios-safari-rejection
            spec: tests/mobile/upload-docx-ios-safari-rejection.spec.py
            browser: webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Bun global store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}

      - name: Install JS dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-v1

      - name: Install Playwright (Python) + ${{ matrix.browser }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps ${{ matrix.browser }}
          else
            python -m playwright install --with-deps ${{ matrix.browser }}
          fi

      - name: Cache Vite build
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vinxi
            .output
            .tanstack
          key: ${{ runner.os }}-vite-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json', 'vite.config.*') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json', 'vite.config.*') }}-
            ${{ runner.os }}-vite-

      - name: Build app
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Generate independent staging browser-auth fixture
        shell: bash
        env:
          STAGING_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          EXPECTED_REF="ypelutaddlibqvpaekyq"
          EXPECTED_URL="https://${EXPECTED_REF}.supabase.co"
          if [ "$STAGING_SUPABASE_URL" != "$EXPECTED_URL" ]; then
            echo "Refusing to create an E2E Auth fixture: VITE_SUPABASE_URL is not aurumvault-staging (${EXPECTED_REF})."
            exit 1
          fi
          if [ -z "$STAGING_SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$STAGING_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing independent staging Supabase credentials."
            exit 1
          fi

          EMAIL="aurumvault-mobile-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.label }}@example.invalid"
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"

          CREATE_BODY="$(jq -nc --arg email "$EMAIL" --arg password "$PASSWORD" '{email:$email,password:$password,email_confirm:true}')"
          CREATE_RESPONSE="$(curl --fail-with-body -sS -X POST "$STAGING_SUPABASE_URL/auth/v1/admin/users" \
            -H "apikey: $STAGING_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $STAGING_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data "$CREATE_BODY")"
          USER_ID="$(jq -r '.id // empty' <<<"$CREATE_RESPONSE")"
          if [ -z "$USER_ID" ]; then
            echo "Supabase did not return a staging E2E user id."
            exit 1
          fi

          LOGIN_BODY="$(jq -nc --arg email "$EMAIL" --arg password "$PASSWORD" '{email:$email,password:$password}')"
          SESSION_JSON="$(curl --fail-with-body -sS -X POST "$STAGING_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $STAGING_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data "$LOGIN_BODY")"
          ACCESS_TOKEN="$(jq -r '.access_token // empty' <<<"$SESSION_JSON")"
          REFRESH_TOKEN="$(jq -r '.refresh_token // empty' <<<"$SESSION_JSON")"
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "Supabase did not return a valid staging browser session."
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$REFRESH_TOKEN"

          echo "AURUMVAULT_STAGING_E2E_USER_ID=$USER_ID" >> "$GITHUB_ENV"
          echo "AURUMVAULT_STAGING_SUPABASE_STORAGE_KEY=sb-${EXPECTED_REF}-auth-token" >> "$GITHUB_ENV"
          echo "AURUMVAULT_STAGING_SUPABASE_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          {
            echo "AURUMVAULT_STAGING_SUPABASE_SESSION_JSON<<__AURUMVAULT_SESSION__"
            echo "$SESSION_JSON"
            echo "__AURUMVAULT_SESSION__"
          } >> "$GITHUB_ENV"

          echo "Independent staging browser-auth fixture created."

      - name: Start dev server
        run: |
          bun run dev -- --host 127.0.0.1 --port 8080 > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Wait for server (http://localhost:8080)
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:8080 > /dev/null; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time"
          tail -n 200 /tmp/dev-server.log
          exit 1

      - name: Run ${{ matrix.spec }}
        env:
          AURUMVAULT_STAGING_AUTH_STATUS: injected
        run: python ${{ matrix.spec }}

      - name: Remove independent staging browser-auth fixture
        if: always()
        shell: bash
        env:
          STAGING_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${AURUMVAULT_STAGING_E2E_USER_ID:-}" ] && [ "$STAGING_SUPABASE_URL" = "https://ypelutaddlibqvpaekyq.supabase.co" ]; then
            curl -sS -X DELETE "$STAGING_SUPABASE_URL/auth/v1/admin/users/$AURUMVAULT_STAGING_E2E_USER_ID" \
              -H "apikey: $STAGING_SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $STAGING_SUPABASE_SERVICE_ROLE_KEY" > /dev/null || true
          fi

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-docx-${{ matrix.label }}-artifacts
          path: |
            tests/mobile/screenshots/**
            /tmp/dev-server.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev-server.pid ]; then
            kill "$(cat /tmp/dev-server.pid)" || true
          fi
