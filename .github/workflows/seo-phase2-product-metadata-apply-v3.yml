# Rerun after scoping the admin write-boundary assertion to the actual update patch.
name: Apply SEO Phase 2 Product Metadata v3

on:
  push:
    branches:
      - seo/phase2-product-metadata
    paths:
      - .github/workflows/seo-phase2-product-metadata-apply-v3.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    name: Apply deterministic Phase 2 patch and verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python3 scripts/seo/apply-phase2-source.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase 2 and redirect regressions
        run: >-
          bunx vitest run
          tests/integration/product-seo-phase2-source-contract.test.ts
          tests/integration/product-seo-brand.test.ts
          tests/integration/product-slug-redirect.test.ts
          tests/integration/product-canonical-list-links.test.ts
          tests/integration/seo-redirect-release-source-contract.test.ts

      - name: Enforce additive migration boundary
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/20260910162000_product_seo_metadata.sql'
          test -f "$migration"
          if grep -Eiq 'update[[:space:]]+public\.marketplace_products|delete[[:space:]]+from[[:space:]]+public\.marketplace_products|set[[:space:]]+slug[[:space:]]*=' "$migration"; then
            echo 'ERROR: Phase 2 migration must not mutate product rows or slugs'
            exit 1
          fi

      - name: Production build
        run: bun run build

      - name: Re-run Phase 2 contract after route generation
        run: bunx vitest run tests/integration/product-seo-phase2-source-contract.test.ts

      - name: Diff safety check
        run: git diff --check

      - name: Commit verified Phase 2 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/seo-phase2-product-metadata-apply.yml
          rm -f .github/workflows/seo-phase2-product-metadata-apply-v2.yml
          rm -f .github/workflows/seo-phase2-product-metadata-apply-v3.yml
          rm -f scripts/seo/apply-phase2-source.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(seo): implement product metadata phase 2"
          git push origin HEAD:seo/phase2-product-metadata
