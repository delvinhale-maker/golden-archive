name: Agent Authority Daily Spend Hardening

on:
  push:
    branches:
      - feature/ai-agent-authority-passport
    paths:
      - .github/workflows/agent-authority-daily-spend-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-authority-daily-spend-hardening
  cancel-in-progress: false

jobs:
  generate-patch-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-agent-authority-passport
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply source hardening patch
        run: python scripts/agent-authority-daily-spend-source-patch.py

      - name: Generate Supabase migration with CLI
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'supabase/migrations/*agent_authority_daily_spend_reservations.sql' > /dev/null; then
            echo 'Agent Authority daily spend migration already exists.' >&2
            exit 1
          fi
          before="$(mktemp)"
          after="$(mktemp)"
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$before"
          bunx supabase migration new agent_authority_daily_spend_reservations
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$after"
          generated="$(comm -13 "$before" "$after" | head -n1)"
          test -n "$generated"
          file="supabase/migrations/$generated"
          cp docs/ai-agent-authority-passport/migration-parts/04-daily-spend-reservations.sql "$file"
          echo "GENERATED_MIGRATION=$file" >> "$GITHUB_ENV"
          grep -q 'pg_advisory_xact_lock' "$file"
          grep -q 'EXECUTION_DAILY_SPEND_RESERVATION_REQUIRED' "$file"
          grep -q 'settle_agent_daily_spend_from_receipt' "$file"
          echo "Generated $file"

      - name: Run Agent Authority tests
        run: bunx vitest run src/lib/agent-authority

      - name: Verify Agent Authority release contract
        run: bun scripts/verify-agent-authority-release-contract.mjs

      - name: Build AurumVault application
        run: bun run build

      - name: Remove temporary hardening machinery
        run: |
          rm .github/workflows/agent-authority-daily-spend-hardening.yml
          rm scripts/agent-authority-daily-spend-source-patch.py

      - name: Commit verified daily spend hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Agent Authority daily spend enforcement transactional'
          git push origin HEAD:feature/ai-agent-authority-passport
