# Durable release gate for AurumVault SEO changes.
# Redirect releases require isolated staging verification before production slug mutations.
name: SEO Regression Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - marketing/trust-taxonomy-homepage
      - "seo/**"
    paths:
      - "src/components/marketplace/**"
      - "src/lib/**"
      - "src/routes/**"
      - "src/routeTree.gen.ts"
      - "tests/integration/**"
      - "supabase/migrations/**"
      - "scripts/seo/**"
      - "scripts/verify-seo-postdeploy.mjs"
      - ".github/workflows/seo-regression.yml"
      - ".github/workflows/seo-postdeploy-verify.yml"
      - ".github/workflows/seo-critical-slug-postdeploy.yml"
  pull_request:
    branches:
      - main
      - marketing/trust-taxonomy-homepage
    paths:
      - "src/components/marketplace/**"
      - "src/lib/**"
      - "src/routes/**"
      - "src/routeTree.gen.ts"
      - "tests/integration/**"
      - "supabase/migrations/**"
      - "scripts/seo/**"
      - "scripts/verify-seo-postdeploy.mjs"
      - ".github/workflows/seo-regression.yml"
      - ".github/workflows/seo-postdeploy-verify.yml"
      - ".github/workflows/seo-critical-slug-postdeploy.yml"

permissions:
  contents: read

concurrency:
  group: seo-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-regression:
    name: SEO regression, taxonomy and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused SEO regression suites
        run: |
          bunx vitest run \
            tests/integration/product-slug-redirect.test.ts \
            tests/integration/products-search-seo.test.ts \
            tests/integration/ai-likeness-rights-risk-checker.test.ts \
            tests/integration/creator-profile-page-schema.test.ts \
            tests/integration/product-seo-brand.test.ts \
            tests/integration/seo-foundation-source-contract.test.ts \
            tests/integration/critical-slug-plan.test.ts

      - name: Run legacy taxonomy regression with Bun
        run: bun test tests/integration/category-legacy-alias-query-fix.test.ts

      - name: Validate post-deploy verifier CLIs
        run: |
          node --check scripts/verify-seo-postdeploy.mjs
          node scripts/verify-seo-postdeploy.mjs --help
          node --check scripts/seo/verify-critical-slug-http.mjs
          node scripts/seo/verify-critical-slug-http.mjs --help

      - name: Verify Phase 1 redirect foundation and cleanup
        run: |
          test -f supabase/migrations/20260909062000_product_slug_redirects.sql
          test ! -d .seo-hardening
          test ! -f .github/workflows/seo-hardening-phase1.yml

      - name: Verify critical slug cleanup remains manual-only
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/seo/critical-slug-plan.json
          test -f scripts/seo/critical-slug-preflight.sql
          test -f scripts/seo/critical-slug-cleanup.sql
          test -f scripts/seo/critical-slug-postflight.sql
          test -f scripts/seo/critical-slug-emergency-revert.sql
          test -f scripts/seo/verify-critical-slug-http.mjs
          test -f .github/workflows/seo-critical-slug-postdeploy.yml
          grep -q "MANUAL PRODUCTION APPROVAL REQUIRED" scripts/seo/critical-slug-cleanup.sql
          grep -q "NEVER move this file into supabase/migrations" scripts/seo/critical-slug-cleanup.sql
          if find supabase/migrations -maxdepth 1 -type f \
            \( -iname '*slug*cleanup*' -o -iname '*slug*rename*' -o -iname '*slug*backfill*' \) \
            | grep -q .; then
            echo "ERROR: slug cleanup/rename/backfill SQL must never be an automatic migration"
            exit 1
          fi

      - name: Production build
        run: bun run build
