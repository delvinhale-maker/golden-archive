name: SEO Staging Edge Verification

on:
  workflow_dispatch:
  push:
    branches:
      - seo/redirect-slug-hardening
    paths:
      - .github/workflows/seo-staging-edge-verify.yml

permissions:
  contents: read

jobs:
  verify:
    name: Verify isolated staging redirect deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFY_URL: https://ypelutaddlibqvpaekyq.supabase.co/functions/v1/seo-redirect-staging-verify
      VERIFY_TOKEN: seo-staging-verifier-2026-09-09
      PRODUCT_UUID: 00000000-0000-4000-8000-000000000901
      CANONICAL_SLUG: seo-staging-canonical-product
      OLD_SLUG: seo-staging-old-product

    steps:
      - name: Probe deployed staging verifier
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "${VERIFY_URL}?token=${VERIFY_TOKEN}&probe=1" \
            -o /tmp/probe.json
          cat /tmp/probe.json
          python - <<'PY'
          import json
          with open('/tmp/probe.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('passed') is True, data
          by_name = {row['name']: row for row in data['results']}
          assert by_name['canonical']['status'] == 200
          for name in ('uuid', 'old-slug'):
              row = by_name[name]
              assert row['status'] == 301, row
              assert row['destinationStatus'] == 200, row
              assert row['destinationCanonical'] is True, row
          print('PASS deployed staging redirect probe')
          PY

      - name: Verify direct canonical response
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/canonical.json --write-out '%{http_code}' \
            "${VERIFY_URL}?token=${VERIFY_TOKEN}&identifier=${CANONICAL_SLUG}")
          test "$code" = "200"
          cat /tmp/canonical.json

      - name: Verify UUID permanent redirect
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --output /dev/null --dump-header /tmp/uuid.headers \
            "${VERIFY_URL}?token=${VERIFY_TOKEN}&identifier=${PRODUCT_UUID}"
          status=$(awk 'NR==1 {print $2}' /tmp/uuid.headers)
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/uuid.headers)
          test "$status" = "301"
          [[ "$location" == *"identifier=${CANONICAL_SLUG}"* ]]

      - name: Verify historical slug permanent redirect
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --output /dev/null --dump-header /tmp/old.headers \
            "${VERIFY_URL}?token=${VERIFY_TOKEN}&identifier=${OLD_SLUG}"
          status=$(awk 'NR==1 {print $2}' /tmp/old.headers)
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' /tmp/old.headers)
          test "$status" = "301"
          [[ "$location" == *"identifier=${CANONICAL_SLUG}"* ]]
