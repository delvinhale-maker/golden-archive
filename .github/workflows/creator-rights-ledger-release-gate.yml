name: Creator Rights Ledger Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - staging/creator-rights-ledger-release-gate
    paths:
      - 'src/features/creator-rights-ledger/**'
      - 'src/routes/_authenticated/creator-rights-ledger.tsx'
      - 'scripts/crl-playwright-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - '.github/workflows/creator-rights-ledger-release-gate.yml'
      - 'docs/creator-rights-ledger/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/features/creator-rights-ledger/**'
      - 'src/routes/_authenticated/creator-rights-ledger.tsx'
      - 'scripts/crl-playwright-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - '.github/workflows/creator-rights-ledger-release-gate.yml'
      - 'docs/creator-rights-ledger/**'

permissions:
  contents: read

concurrency:
  group: crl-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: dependency → types → unit → build → browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 1 — Frozen dependency install
        run: bun install --frozen-lockfile

      - name: 2 — TypeScript
        run: bunx tsc --noEmit

      - name: 3 — Vitest (Creator Rights Ledger)
        run: bunx vitest run src/features/creator-rights-ledger/domain.test.ts

      - name: 4 — TanStack/Vite production build
        run: bun run build

      - name: Verify generated CRL route
        run: grep -q "creator-rights-ledger" src/routeTree.gen.ts

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start built TanStack/Nitro production server
        env:
          HOST: 127.0.0.1
          PORT: '4173'
          NITRO_HOST: 127.0.0.1
          NITRO_PORT: '4173'
        run: |
          bun .output/server/index.mjs > /tmp/crl-preview.log 2>&1 &
          echo $! > /tmp/crl-preview.pid
          for i in {1..120}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/ >/dev/null; then
              echo "Production server ready after ${i}s"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/crl-preview.pid)" 2>/dev/null; then
              echo "Production server exited before becoming ready"
              cat /tmp/crl-preview.log
              exit 1
            fi
            sleep 1
          done
          echo "Production server did not become ready within 120 seconds"
          cat /tmp/crl-preview.log
          exit 1

      - name: 5 — Playwright production-route smoke
        run: bun scripts/crl-playwright-smoke.mjs

      - name: Upload CRL browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crl-release-gate-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/crl-preview.log
            playwright-report/
            test-results/
