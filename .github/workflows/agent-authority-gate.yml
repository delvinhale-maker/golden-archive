name: Agent Authority Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/agent-authority/**"
      - "src/routes/_authenticated/agent-authority.tsx"
      - "src/routes/api/agent-authority/**"
      - "docs/ai-agent-authority-passport/**"
      - "src/routeTree.gen.ts"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - ".github/workflows/agent-authority-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/agent-authority/**"
      - "src/routes/_authenticated/agent-authority.tsx"
      - "src/routes/api/agent-authority/**"
      - "docs/ai-agent-authority-passport/**"
      - "src/routeTree.gen.ts"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - ".github/workflows/agent-authority-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Agent Authority tests + repository build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun global store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Agent Authority behavior and receipt tests
        run: bunx vitest run src/lib/agent-authority

      - name: Build AurumVault application
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
