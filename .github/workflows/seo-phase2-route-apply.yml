name: SEO Phase 2 Route Apply

on:
  push:
    branches:
      - seo/phase2-harden-staging2
    paths:
      - .github/workflows/seo-phase2-route-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: seo/phase2-harden-staging2
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Harden admin route
        run: python3 scripts/phase2-harden-route.py

      - name: Run SEO regressions
        run: |
          bunx vitest run \
            tests/integration/product-seo-phase2-source-contract.test.ts \
            tests/integration/product-slug-redirect.test.ts \
            tests/integration/product-seo-brand.test.ts \
            tests/integration/product-canonical-list-links.test.ts \
            tests/integration/seo-redirect-release-source-contract.test.ts

      - name: Typecheck
        run: bunx tsgo --noEmit

      - name: Production build
        run: bun run build

      - name: Diff safety
        run: |
          git diff --check
          test -z "$(git diff --name-only -- . ':!src/routes/_authenticated/admin.academy.product-seo.tsx')"

      - name: Commit hardened route
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/admin.academy.product-seo.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(seo): route product SEO through server admin guard'
          git push origin HEAD:seo/phase2-harden-staging2
