name: Agent Authority Staging Parity

on:
  push:
    branches:
      - feature/ai-agent-authority-passport
    paths:
      - .github/workflows/agent-authority-staging-parity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-authority-staging-parity
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-agent-authority-passport
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate CLI migration
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'supabase/migrations/*agent_authority_staging_advisor_hardening.sql' > /dev/null; then
            echo 'Staging advisor hardening migration already exists.' >&2
            exit 1
          fi
          before="$(mktemp)"
          after="$(mktemp)"
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$before"
          bunx supabase migration new agent_authority_staging_advisor_hardening
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$after"
          generated="$(comm -13 "$before" "$after" | head -n1)"
          test -n "$generated"
          file="supabase/migrations/$generated"
          cat > "$file" <<'SQL'
          -- Findings captured from isolated Agent Authority staging advisors.
          -- Keep append-only trigger execution deterministic and optimize auth.uid() RLS evaluation.

          alter function public.aa_prevent_append_only_mutation() set search_path = '';

          drop policy if exists "aa membership self or admins" on public.agent_authority_members;
          create policy "aa membership self or admins"
          on public.agent_authority_members for select to authenticated
          using (
            user_id = (select auth.uid())
            or private.agent_authority_has_role(workspace_id, array['OWNER','ADMIN'])
          );
          SQL
          echo "GENERATED_MIGRATION=$file" >> "$GITHUB_ENV"
          echo "Generated $file"

      - name: Run Agent Authority tests
        run: bunx vitest run src/lib/agent-authority

      - name: Verify Agent Authority release contract
        run: bun scripts/verify-agent-authority-release-contract.mjs

      - name: Build AurumVault application
        run: bun run build

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$GENERATED_MIGRATION"
          git commit -m 'Add Agent Authority staging advisor hardening migration'
          git push origin HEAD:feature/ai-agent-authority-passport
