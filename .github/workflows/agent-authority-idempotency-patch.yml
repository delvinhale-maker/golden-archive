name: Agent Authority Idempotency Patch

on:
  push:
    branches: [feature/ai-agent-authority-passport]
    paths:
      - ".github/workflows/agent-authority-idempotency-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-agent-authority-passport
          fetch-depth: 0

      - name: Patch submitAction trust boundaries
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/lib/agent-authority/service.server.ts")
          text = path.read_text()

          delegation_import = 'import { assertActionApprovalAuthority } from "./delegation.server";\n'
          if delegation_import not in text:
              raise SystemExit("Expected delegation import not found")
          imports = (
              delegation_import
              + 'import { waitForIdempotentDecision } from "./idempotency";\n'
              + 'import { loadRecordedDailyPurchaseSpend } from "./daily-spend.server";\n'
          )
          text = text.replace(delegation_import, imports, 1)

          submit_marker = "export async function submitAction(\n"
          submit_index = text.index(submit_marker)
          helper = '''async function loadIdempotentReplay(client: any, actionRequestId: string) {
            const existingDecision = await waitForIdempotentDecision(async () => {
              const { data, error } = await client
                .from("action_decisions")
                .select("id,decision,primary_reason,reason_codes,policy_code,policy_version,decided_at")
                .eq("action_request_id", actionRequestId)
                .maybeSingle();
              if (error) throw error;
              return data ?? null;
            });
            return { idempotentReplay: true, actionRequestId, decision: existingDecision };
          }

          '''
          text = text[:submit_index] + helper + text[submit_index:]

          submit_index = text.index(submit_marker)
          existing_start = text.index("  if (existing) {", submit_index)
          policy_marker = "\n\n  const policy = await loadPolicy"
          existing_end = text.index(policy_marker, existing_start)
          text = text[:existing_start] + "  if (existing) return loadIdempotentReplay(client, existing.id);" + text[existing_end:]

          old_eval = '''  const requestForEvaluation = { ...input.request, dataClassification: resolvedClassification };
          const evaluated = evaluateActionGate(policy, requestForEvaluation);
          '''
          new_eval = '''  const dailySpendToDate =
            input.request.amountKind === "PURCHASE" && policy.limits.maxDailySpend != null
              ? await loadRecordedDailyPurchaseSpend({ client, workspaceId: input.workspaceId, passportId: input.passportId })
              : 0;
          const requestForEvaluation = {
            ...input.request,
            dataClassification: resolvedClassification,
            // Never trust a caller-supplied spend-to-date value for an authorization limit.
            dailySpendToDate,
          };
          const evaluated = evaluateActionGate(policy, requestForEvaluation);
          '''
          if old_eval not in text:
              raise SystemExit("Action evaluation block not found")
          text = text.replace(old_eval, new_eval, 1)

          conflict_start = text.index("  if (requestError) {", text.index("export async function submitAction("))
          policy_code_marker = "\n\n  const policyCode = `PASSPORT:${policy.passportCode}`;"
          conflict_end = text.index(policy_code_marker, conflict_start)
          conflict = '''  if (requestError) {
            // A concurrent duplicate is expected to lose on the unique idempotency constraint.
            // Read the winner directly and wait briefly for its decision instead of recursively
            // re-entering submitAction, which could race against the winner's decision insert.
            if (String(requestError.code) === "23505") {
              const { data: winner, error: winnerError } = await client
                .from("action_requests")
                .select("id")
                .eq("workspace_id", input.workspaceId)
                .eq("idempotency_key", input.request.idempotencyKey)
                .maybeSingle();
              if (winnerError) throw winnerError;
              if (!winner) throw requestError;
              return loadIdempotentReplay(client, winner.id);
            }
            throw requestError;
          }'''
          text = text[:conflict_start] + conflict + text[conflict_end:]

          path.write_text(text)

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-authority-idempotency-patch.yml
          git add src/lib/agent-authority/service.server.ts
          git commit -m "Harden Agent Authority action trust boundaries"
          git push origin HEAD:feature/ai-agent-authority-passport
