name: Canva CAS hotfix

on:
  push:
    branches:
      - canva/creator-studio-completion
    paths:
      - .github/workflows/canva-cas-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: contains(github.event.head_commit.message, '[run-canva-cas-hotfix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canva/creator-studio-completion
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Patch Canva refresh CAS
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/lib/canva-oauth.ts')
          text = path.read_text()

          old = '''type CanvaConnectionRow = {
            id: string;
            status: string;
            access_token_enc: unknown;
            refresh_token_enc: unknown;
            access_token_expires_at: string | null;
            updated_at: string;
          };'''
          new = '''type CanvaConnectionRow = {
            id: string;
            status: string;
            access_token_enc: unknown;
            refresh_token_enc: unknown;
            access_token_expires_at: string | null;
            refresh_version: number;
          };'''
          if old not in text:
            raise SystemExit('CanvaConnectionRow pattern not found')
          text = text.replace(old, new, 1)

          old = '.select("id, status, access_token_enc, refresh_token_enc, access_token_expires_at, updated_at")'
          new = '.select("id, status, access_token_enc, refresh_token_enc, access_token_expires_at, refresh_version")'
          if old not in text:
            raise SystemExit('connection select pattern not found')
          text = text.replace(old, new, 1)

          text = text.replace(
            'integration_connections.updated_at — no new column, no in-memory lock (an',
            'integration_connections.refresh_version — a monotonic server-only counter, no in-memory lock (an',
            1,
          )

          old = '''  const claimedUpdatedAt = await claimCanvaRefreshSlot(supabase, row.id, row.updated_at);

          if (!claimedUpdatedAt) {'''
          new = '''  const claimedRefreshVersion = await claimCanvaRefreshSlot(
            supabase,
            row.id,
            row.refresh_version,
          );

          if (claimedRefreshVersion === null) {'''
          if old not in text:
            raise SystemExit('claim call pattern not found')
          text = text.replace(old, new, 1)

          text = text.replace(
            'await markCanvaErrorIfUnchanged(supabase, row.id, claimedUpdatedAt, "token_refresh_failed");',
            'await markCanvaErrorIfUnchanged(supabase, row.id, claimedRefreshVersion, "token_refresh_failed");',
            1,
          )

          old = '''  const stored = await storeRefreshedCanvaTokenIfUnchanged(supabase, {
            rowId: row.id,
            ownerUserId: userId,
            tokens,
            expectedUpdatedAt: claimedUpdatedAt,
            fallbackRefreshTokenEnc: row.refresh_token_enc,
          });

          if (!stored) {
            // We hold the claim and have a token Canva just issued to us — write it
            // unconditionally rather than discarding a successfully refreshed token.
            await storeCanvaConnection(supabase, { rowId: row.id, ownerUserId: userId, tokens });
          }

          return tokens.access_token;'''
          new = '''  const stored = await storeRefreshedCanvaTokenIfUnchanged(supabase, {
            rowId: row.id,
            ownerUserId: userId,
            tokens,
            expectedRefreshVersion: claimedRefreshVersion,
            fallbackRefreshTokenEnc: row.refresh_token_enc,
          });

          if (!stored) {
            // The row changed after we claimed the refresh slot. Never overwrite
            // that newer state: a concurrent disconnect/revoke/error/update wins.
            // Re-read and use a newer usable connected token if one exists;
            // otherwise fail closed and require reconnect rather than resurrecting
            // the connection with an unconditional write.
            return resolveRefreshStoreCasLoss(supabase, userId);
          }

          return tokens.access_token;'''
          if old not in text:
            raise SystemExit('store fallback pattern not found')
          text = text.replace(old, new, 1)

          old = ''' * Attempts to claim the exclusive right to refresh this connection by
           * touching the row only if `updated_at` still matches `expectedUpdatedAt`
           * (optimistic concurrency). Returns the row's new `updated_at` (the CAS
           * token for the follow-up store) on success, or null if another request
           * already changed the row first.'''
          new = ''' * Attempts to claim the exclusive right to refresh this connection by
           * touching the row only if `refresh_version` still matches the version
           * observed by the caller. A database trigger increments refresh_version
           * on every UPDATE, so unlike transaction-stable `now()`/updated_at it is
           * a reliable CAS token even for rapid or same-transaction writes.'''
          if old not in text:
            raise SystemExit('claim comment pattern not found')
          text = text.replace(old, new, 1)

          old = '''async function claimCanvaRefreshSlot(
            supabase: SupabaseClient,
            rowId: string,
            expectedUpdatedAt: string,
          ): Promise<string | null> {
            const { data, error } = await supabase
              .from("integration_connections")
              .update({ last_error: null })
              .eq("id", rowId)
              .eq("updated_at", expectedUpdatedAt)
              .select("updated_at")
              .maybeSingle();
            if (error || !data) return null;
            return (data as { updated_at: string }).updated_at;
          }'''
          new = '''async function claimCanvaRefreshSlot(
            supabase: SupabaseClient,
            rowId: string,
            expectedRefreshVersion: number,
          ): Promise<number | null> {
            const { data, error } = await supabase
              .from("integration_connections")
              .update({ last_error: null })
              .eq("id", rowId)
              .eq("refresh_version", expectedRefreshVersion)
              .select("refresh_version")
              .maybeSingle();
            if (error || !data) return null;
            return (data as { refresh_version: number }).refresh_version;
          }'''
          if old not in text:
            raise SystemExit('claim function pattern not found')
          text = text.replace(old, new, 1)

          text = text.replace('expectedUpdatedAt: string;', 'expectedRefreshVersion: number;', 1)
          text = text.replace('.eq("updated_at", args.expectedUpdatedAt)', '.eq("refresh_version", args.expectedRefreshVersion)', 1)

          old = '''async function markCanvaErrorIfUnchanged(
            supabase: SupabaseClient,
            rowId: string,
            expectedUpdatedAt: string,
            reason: string,
          ): Promise<void> {
            await supabase
              .from("integration_connections")
              .update({
                status: "error",
                last_error: reason.slice(0, 300),
                oauth_state: null,
                code_verifier_enc: null,
                state_expires_at: null,
              })
              .eq("id", rowId)
              .eq("updated_at", expectedUpdatedAt);
          }'''
          new = '''async function markCanvaErrorIfUnchanged(
            supabase: SupabaseClient,
            rowId: string,
            expectedRefreshVersion: number,
            reason: string,
          ): Promise<void> {
            await supabase
              .from("integration_connections")
              .update({
                status: "error",
                last_error: reason.slice(0, 300),
                oauth_state: null,
                code_verifier_enc: null,
                state_expires_at: null,
              })
              .eq("id", rowId)
              .eq("refresh_version", expectedRefreshVersion);
          }

          /**
           * A successful Canva refresh may finish after another request has changed
           * the connection row. The newer database state always wins. We never
           * unconditionally restore the just-issued token because doing so could
           * resurrect a connection the creator disconnected while refresh was in
           * flight.
           */
          async function resolveRefreshStoreCasLoss(
            supabase: SupabaseClient,
            userId: string,
          ): Promise<string> {
            const fresh = await readCanvaConnectionRow(supabase, userId);
            if (fresh?.status === "connected" && fresh.access_token_enc && !isNearExpiry(fresh)) {
              return decryptOAuthSecret(fresh.access_token_enc);
            }
            if (!fresh || fresh.status === "revoked") {
              throw new CanvaApiError("not_connected", "Canva is no longer connected");
            }
            throw new CanvaApiError(
              "reauth_required",
              "Canva authorization changed while the token was refreshing; reconnect to continue",
            );
          }'''
          if old not in text:
            raise SystemExit('mark error function pattern not found')
          text = text.replace(old, new, 1)

          if 'await storeCanvaConnection(supabase, { rowId: row.id, ownerUserId: userId, tokens });' in text:
            raise SystemExit('unconditional refresh fallback still present')
          if 'expectedUpdatedAt' in text:
            raise SystemExit('stale expectedUpdatedAt reference still present')

          path.write_text(text)

      - name: Add source contract tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/integration/canva-refresh-version-contract.test.ts')
          p.write_text('''import { describe, expect, test } from "bun:test";\nimport { readFileSync } from "node:fs";\n\nconst source = readFileSync("src/lib/canva-oauth.ts", "utf8");\nconst migration = readFileSync("docs/proposed-migrations/20260909112100_add_integration_refresh_version.sql", "utf8");\n\ndescribe("Canva refresh version CAS contract", () => {\n  test("uses refresh_version instead of updated_at as refresh CAS", () => {\n    expect(source).toContain("refresh_version: number");\n    expect(source).toContain('.eq("refresh_version", expectedRefreshVersion)');\n    expect(source).not.toContain('.eq("updated_at", expectedUpdatedAt)');\n  });\n\n  test("never falls back to an unconditional token store after CAS loss", () => {\n    expect(source).toContain("return resolveRefreshStoreCasLoss(supabase, userId)");\n    expect(source).not.toContain("unconditionally rather than discarding a successfully refreshed token");\n  });\n\n  test("migration defines a monotonic server-only refresh version", () => {\n    expect(migration).toContain("refresh_version BIGINT NOT NULL DEFAULT 0");\n    expect(migration).toContain("NEW.refresh_version = OLD.refresh_version + 1");\n    expect(migration).toContain("REVOKE ALL (refresh_version)");\n  });\n});\n''')

      - name: Run targeted Canva tests
        run: |
          bun test tests/unit/canva-design-client.test.ts tests/integration/canva-design-import.test.ts tests/integration/canva-refresh-version-contract.test.ts

      - name: Commit hotfix
        run: |
          git config user.name "AurumVault Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/canva-oauth.ts tests/integration/canva-refresh-version-contract.test.ts
          git commit -m "Harden Canva refresh CAS against concurrent disconnect [canva-cas-hotfix]"
          git push origin HEAD:canva/creator-studio-completion
