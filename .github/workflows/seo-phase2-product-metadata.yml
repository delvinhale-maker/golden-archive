name: SEO Phase 2 Product Metadata Gate

on:
  workflow_dispatch:
  push:
    branches:
      - "seo/phase2-product-metadata-hardened"
    paths:
      - "src/lib/marketplace.functions.ts"
      - "src/lib/product-seo-admin.functions.ts"
      - "src/routes/products.$id.tsx"
      - "src/routes/sitemap[.]xml.ts"
      - "src/routes/_authenticated/admin.academy.product-seo.tsx"
      - "src/routes/_authenticated/admin.academy.upload.tsx"
      - "src/routeTree.gen.ts"
      - "supabase/migrations/20260910162000_product_seo_metadata.sql"
      - "tests/integration/product-seo-phase2-source-contract.test.ts"
      - ".github/workflows/seo-phase2-product-metadata.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/marketplace.functions.ts"
      - "src/lib/product-seo-admin.functions.ts"
      - "src/routes/products.$id.tsx"
      - "src/routes/sitemap[.]xml.ts"
      - "src/routes/_authenticated/admin.academy.product-seo.tsx"
      - "src/routes/_authenticated/admin.academy.upload.tsx"
      - "src/routeTree.gen.ts"
      - "supabase/migrations/20260910162000_product_seo_metadata.sql"
      - "tests/integration/product-seo-phase2-source-contract.test.ts"
      - ".github/workflows/seo-phase2-product-metadata.yml"

permissions:
  contents: read

concurrency:
  group: seo-phase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase2-gate:
    name: Product SEO metadata security, regression and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate additive migration boundary
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/migrations/20260910162000_product_seo_metadata.sql'
          test -f "$file"
          if grep -Eiq 'update[[:space:]]+public\.marketplace_products|insert[[:space:]]+into[[:space:]]+public\.marketplace_products|delete[[:space:]]+from[[:space:]]+public\.marketplace_products|set[[:space:]]+slug[[:space:]]*=' "$file"; then
            echo 'ERROR: Phase 2 migration must be additive and must not mutate product rows/slugs'
            exit 1
          fi

      - name: Run Phase 2 and redirect regressions
        run: |
          bunx vitest run \
            tests/integration/product-seo-phase2-source-contract.test.ts \
            tests/integration/product-slug-redirect.test.ts \
            tests/integration/product-seo-brand.test.ts \
            tests/integration/product-canonical-list-links.test.ts \
            tests/integration/seo-redirect-release-source-contract.test.ts

      - name: TypeScript check
        run: bunx tsgo --noEmit

      - name: Production build
        run: bun run build
