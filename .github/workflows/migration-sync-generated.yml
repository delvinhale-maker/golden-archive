name: Migration Sync Generated Artifacts

on:
  push:
    branches:
      - migration/aurumvault-lovable-exit

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/aurumvault-lovable-exit
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh Bun lockfile
        run: bun install

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Regenerate TanStack route tree
        run: bunx @tanstack/router-cli@latest generate

      - name: Commit generated artifacts
        shell: bash
        run: |
          git add bun.lock package-lock.json src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "No generated artifact changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync migration generated artifacts"
          git push origin HEAD:migration/aurumvault-lovable-exit
