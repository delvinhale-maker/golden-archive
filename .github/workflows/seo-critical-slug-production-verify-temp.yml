name: SEO Critical Slug Production Verification

on:
  push:
    branches:
      - verify/critical-slugs-production
    paths:
      - .github/workflows/seo-critical-slug-production-verify-temp.yml

permissions:
  contents: read

jobs:
  verify-critical-slugs:
    name: Verify all 17 production canonical and redirect URLs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://www.aurumvault.store
      SOCIAL_OLD_SLUG: >-
        the-interactive-social-media-content-planner-is-a-premium-digital-planning-system-designed-to-help-creators-entrepreneurs-small-businesses-coaches-service-providers-and-brands-organize-their-social-media-strategy-in-one-place-instead-of-guessing-what-to-post-each-day-this-planner-helps-you-define-your-audience-organize-content-pillars-plan-monthly-and-weekly-posts-prepare-captions-and-ctas-manage-campaigns-track-leads-measure-performance-and-build-a-more-consistent-social-media-presence-the-interactive-format-includes-fillable-fields-checkboxes-dropdown-menus-calendars-trackers-and-performance-pages-making-it-easy-to-plan-directly-inside-the-pdf-from-your-computer-or-compatible-device-whether-you-re-managing-one-platform-or-several-this-planner-helps-turn-scattered-content-ideas-into-a-clear-repeatable-system-plan-create-post-measure-grow-what-s-included-interactive-brand-social-media-profile-audience-ideal-customer-profiles-content-pillar-planning-platform-strategy-pages-30-day-content-calendars-weekly-content-planners-individual-post-planning-pages-caption-script-planning-hook-and-cta-planning-social-media-campaign-planners-content-idea-bank-caption-hook-cta-bank-hashtag-keyword-tracker-content-asset-tracker-content-repurposing-tracker-collaboration-ugc-testimonial-tracker-community-engagement-tracker-social-media-lead-tracker-conversion-revenue-attribution-tracker-monthly-social-media-dashboard-platform-performance-tracker-top-performing-content-tracker-monthly-content-audit-competitor-inspiration-tracker-90-day-social-media-growth-plan-monthly-growth-action-plans-final-90-day-performance-review-fillable-text-fields-throughout-interactive-checkboxes-dropdown-status-menus-content-planning-and-performance-tracking-in-one-system-digital-interactive-pdf-only-no-physical-product-will-be-shipped

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify all 17 critical production URLs
        run: |
          node scripts/seo/verify-critical-slug-http.mjs \
            --base-url "$BASE_URL" \
            --social-planner-old-slug "$SOCIAL_OLD_SLUG" \
            --timeout-ms "20000"
