name: SEO Redirect Foundation Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - "release/seo-redirect-foundation"
    paths:
      - "src/lib/categories.ts"
      - "src/lib/marketplace.functions.ts"
      - "src/lib/product-seo.ts"
      - "src/lib/product-slug-redirect.ts"
      - "src/routes/products.$id.tsx"
      - "src/components/marketplace/ProductCard.tsx"
      - "supabase/migrations/20260909062000_product_slug_redirects.sql"
      - "tests/integration/product-slug-redirect.test.ts"
      - "tests/integration/product-seo-brand.test.ts"
      - "tests/integration/seo-redirect-release-source-contract.test.ts"
      - "scripts/verify-seo-redirect-production.mjs"
      - ".github/workflows/seo-redirect-release-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/categories.ts"
      - "src/lib/marketplace.functions.ts"
      - "src/lib/product-seo.ts"
      - "src/lib/product-slug-redirect.ts"
      - "src/routes/products.$id.tsx"
      - "src/components/marketplace/ProductCard.tsx"
      - "supabase/migrations/20260909062000_product_slug_redirects.sql"
      - "tests/integration/product-slug-redirect.test.ts"
      - "tests/integration/product-seo-brand.test.ts"
      - "tests/integration/seo-redirect-release-source-contract.test.ts"
      - "scripts/verify-seo-redirect-production.mjs"
      - ".github/workflows/seo-redirect-release-gate.yml"

permissions:
  contents: read

concurrency:
  group: seo-redirect-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Redirect foundation regression and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run redirect foundation regressions
        run: |
          bunx vitest run \
            tests/integration/product-slug-redirect.test.ts \
            tests/integration/product-seo-brand.test.ts \
            tests/integration/seo-redirect-release-source-contract.test.ts

      - name: Validate production verifier
        run: |
          node --check scripts/verify-seo-redirect-production.mjs
          node scripts/verify-seo-redirect-production.mjs --help

      - name: Enforce foundation-only migration boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260909062000_product_slug_redirects.sql
          if grep -Eiq 'update[[:space:]]+public\.marketplace_products|set[[:space:]]+slug[[:space:]]*=' supabase/migrations/20260909062000_product_slug_redirects.sql; then
            echo "ERROR: redirect foundation migration must not mutate product slugs"
            exit 1
          fi
          if find supabase/migrations -maxdepth 1 -type f \
            \( -iname '*slug*cleanup*' -o -iname '*slug*rename*' -o -iname '*slug*backfill*' \) \
            | grep -q .; then
            echo "ERROR: slug cleanup/rename/backfill must not be part of this release"
            exit 1
          fi

      - name: Production build
        run: bun run build
