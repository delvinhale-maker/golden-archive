name: Apply SEO Canonical List Links Fix

on:
  push:
    branches:
      - seo/canonical-list-links
    paths:
      - .github/workflows/seo-canonical-list-links-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    name: Patch canonical list queries and verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact two-query patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lib/marketplace.functions.ts")
          text = path.read_text()

          replacements = [
              (
                  '"id,title,category,price_cents,cover_url,description,seller_id,created_at"',
                  '"id,slug,title,category,price_cents,cover_url,description,seller_id,created_at"',
              ),
              (
                  '"id,title,category,price_cents,compare_at_price_cents,cover_url,description,seller_id,created_at"',
                  '"id,slug,title,category,price_cents,compare_at_price_cents,cover_url,description,seller_id,created_at"',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one source anchor for {old!r}; found {count}")
              text = text.replace(old, new, 1)

          catalog = '"id,slug,title,category,subcategory,product_type,delivery_contents,price_cents,compare_at_price_cents,cover_url,description,seller_id,created_at"'
          if catalog not in text:
              raise SystemExit("General catalog query no longer selects slug")

          path.write_text(text)
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run canonical-list regression
        run: bunx vitest run tests/integration/product-canonical-list-links.test.ts

      - name: Production build
        run: bun run build

      - name: Diff safety check
        run: git diff --check

      - name: Commit verified source fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/seo-canonical-list-links-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/marketplace.functions.ts .github/workflows/seo-canonical-list-links-apply.yml
          git diff --cached --check
          git commit -m "fix(seo): use canonical slugs on product list surfaces"
          git push origin HEAD:seo/canonical-list-links
