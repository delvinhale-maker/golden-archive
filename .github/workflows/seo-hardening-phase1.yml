# trigger: corrected phase-1 declaration gate
name: SEO hardening phase 1

on:
  push:
    branches:
      - seo/redirect-slug-hardening
    paths:
      - .github/workflows/seo-hardening-phase1.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: seo/redirect-slug-hardening
          fetch-depth: 0

      - name: Reconstruct and verify prepared SEO implementation
        shell: bash
        run: |
          cat \
            .seo-hardening/exact00.b64 \
            .seo-hardening/exact01.b64 \
            .seo-hardening/exact02.b64 \
            .seo-hardening/exact03.b64 \
            .seo-hardening/exact04.b64 \
            .seo-hardening/exact05.b64 \
            .seo-hardening/exact06.b64 \
            .seo-hardening/exact07.b64 \
            | base64 --decode > /tmp/seo-phase1.tar.gz
          echo "57a16ef59903e20a9dc085e9c85e12d40ca76dbc92e23d150ec941a03e6d00c3  /tmp/seo-phase1.tar.gz" | sha256sum -c -
          mkdir -p .seo-hardening-v2
          tar -xzf /tmp/seo-phase1.tar.gz -C .seo-hardening-v2
          sed -i 's/^clientBlock=/const clientBlock=/' .seo-hardening-v2/scripts/apply-phase1-seo-foundation.mjs
          node --check .seo-hardening-v2/scripts/apply-phase1-seo-foundation.mjs

      - name: Apply fail-fast source transformations
        run: node .seo-hardening-v2/scripts/apply-phase1-seo-foundation.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run targeted SEO regression tests
        run: |
          bunx vitest run \
            tests/integration/product-slug-redirect.test.ts \
            tests/integration/products-search-seo.test.ts \
            tests/integration/ai-likeness-rights-risk-checker.test.ts \
            tests/integration/creator-profile-page-schema.test.ts \
            tests/integration/product-seo-brand.test.ts \
            tests/integration/seo-foundation-source-contract.test.ts \
            tests/integration/category-legacy-alias-query-fix.test.ts

      - name: Production build
        run: bun run build

      - name: Safety gate
        run: |
          test -f supabase/migrations/20260909062000_product_slug_redirects.sql
          test ! -f supabase/migrations/20260909063000_slug_cleanup.sql
          git diff --check

      - name: Commit verified Phase 1 implementation
        shell: bash
        run: |
          rm -rf .seo-hardening-v2
          git rm -r .seo-hardening
          git rm .github/workflows/seo-hardening-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests supabase/migrations
          git commit -m "feat(seo): harden redirects and organic acquisition foundation"
          git push origin HEAD:seo/redirect-slug-hardening
